{% extends 'core/base.html' %}
{% block title %}Sign Up{% endblock %}

{% block content %}
<div class="flex justify-center items-center min-h-screen bg-gray-50">
  <div class="bg-white shadow-xl rounded-2xl p-8 w-full max-w-md">
    <h2 class="text-2xl font-bold text-center text-blue-600 mb-6">Create Your Account</h2>
    
    <form method="POST" class="space-y-5">
      {% csrf_token %}
      
      {% for field in form %}
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">{{ field.label }}</label>
          {{ field }}
          {% if field.errors %}
            <p class="text-red-500 text-sm mt-1">{{ field.errors|striptags }}</p>
          {% endif %}
        </div>
      {% endfor %}
      
      <div class="flex justify-between items-center">
        <p class="text-sm text-gray-600">Already have an account? 
          <a href="{% url 'accounts:login' %}" class="text-blue-600 hover:underline">Login</a>
        </p>
      </div>

      <button type="submit"
        class="w-full bg-blue-600 text-white py-2 rounded-lg font-semibold hover:bg-blue-700 transition duration-200">
        Sign Up
      </button>
    </form>
  </div>
</div>
{% endblock %}
