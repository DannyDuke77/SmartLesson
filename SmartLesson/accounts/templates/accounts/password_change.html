{% extends 'core/base.html' %}
{% block title %}Change Password{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto mt-16 bg-white rounded-2xl shadow-lg p-8">
  <h1 class="text-2xl font-bold text-gray-800 mb-6">Change Your Password</h1>

  <form method="post" class="space-y-6">
    {% csrf_token %}
    {% for field in form %}
      <div>
        <label for="{{ field.id_for_label }}" class="block text-gray-700 font-medium mb-1">
          {{ field.label }}
        </label>
        {{ field }}
        {% if field.errors %}
          <p class="text-red-600 text-sm mt-1">{{ field.errors|striptags }}</p>
        {% endif %}
      </div>
    {% endfor %}

    <button type="submit"
      class="w-full bg-blue-600 text-white font-semibold py-2.5 rounded-lg hover:bg-blue-700 transition">
      Update Password
    </button>
  </form>

  <p class="mt-6 text-center text-sm text-gray-500">
    <a href="{% url 'accounts:profile' %}" class="text-blue-600 hover:underline">← Back to Profile</a>
  </p>
</div>

<style>
  input[type="password"] {
    @apply w-full border border-gray-300 rounded-lg px-4 py-2 
           focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition;
  }
</style>
{% endblock %}
