{% extends 'core/base.html' %}
{% block title %}Password Changed{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto mt-20 bg-white rounded-2xl shadow-lg p-8 text-center">
  <h1 class="text-2xl font-bold text-green-700 mb-3">Password Updated Successfully!</h1>
  <p class="text-gray-600 mb-6">
    Your password has been changed. You can continue using your account securely.
  </p>
  <a href="{% url 'accounts:profile' %}" 
     class="inline-block bg-blue-600 text-white px-5 py-2 rounded-lg font-medium hover:bg-blue-700 transition">
     Back to Profile
  </a>
</div>
{% endblock %}
